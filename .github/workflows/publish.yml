name: Publish Ambrogio Site

on:
  # `main` is this repository's default branch and the branch the checkout carries; the
  # wiki, the blog and the teaching site are published on push to the branch they carry,
  # and this site used to watch `master` while every push went to `main` — a push that
  # published nothing (step 47, finding 1).  Keep this name in step with the default
  # branch: `gh api repos/tazzo/ambrogio.tazlab.net --jq .default_branch`.
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # **The repository's own checks, before anything is published.** Two scripts the tree
      # already carried and no run ever called (step 49): `verify-project.sh --in-repo` —
      # the citations in PROGETTO.md this checkout can be held to, since a runner carries
      # this repository and not the sibling trees (`wiki.tazlab.net/`, `blog-src/`,
      # `tazlab-k8s/`, `ambrogio/`) — and `verify-logo-files.sh`, the mark's file half:
      # `ambrogio-site/site/logo.png` against its pinned digest, the five pages' markup, the
      # drawn height the stylesheet states, the favicon's digest.
      #
      # They stand before the login on purpose: a tree that fails its own checks must not
      # touch the registry at all. Both are offline — no network, no sibling checkout — and
      # neither reads the live site, because the live site is the *previous* deployment and a
      # check of it would say nothing about the image being built. The halves that need a
      # sibling tree or the wire stay on the operator's machine: `verify-project.sh` (without
      # `--in-repo`) and `verify-logo.sh`, which runs the file half and then fetches
      # https://ambrogio.tazlab.net/logo.png.
      - name: The repository's own checks
        run: |
          sh verify-project.sh --in-repo
          sh verify-logo-files.sh

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "roberto.tazzoli@gmail.com"
          password: ${{ secrets.DOCKER_PASSWORD }}

      # The site's source lives in ambrogio-site/ (the repository's root also carries the
      # project's documents); the build context is that directory, which is what the
      # Dockerfile's `COPY site/ ...` is relative to.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ambrogio-site
          file: ambrogio-site/Dockerfile
          push: true
          tags: |
            tazzo/tazlab-ambrogio-site:latest
            tazzo/tazlab-ambrogio-site:ambrogio-site-${{ github.run_number }}-${{ github.sha }}
